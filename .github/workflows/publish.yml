name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pajabi/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
      - run: uv lock --check
      - run: uv run --locked ruff check
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv build --out-dir dist
      - name: Confirm the wheel ships py.typed and imports
        run: |
          unzip -Z1 dist/*.whl | grep -qx 'pajabi/py.typed'
          wheel=$(echo dist/*.whl)
          uv run --no-project --isolated --with "$wheel" python -c "import pajabi, importlib.metadata as m; assert m.version('pajabi') == pajabi.__version__"
      - run: uv publish --trusted-publishing always
