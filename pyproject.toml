[project]
name = "pajabi"
dynamic = ["version"]
description = "Typed Python client for the Kajabi Public API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Eri Bastos", email = "bastos.eri@gmail.com" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/ebastos/pajabi"
Repository = "https://github.com/ebastos/pajabi"
Issues = "https://github.com/ebastos/pajabi/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pajabi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pajabi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pajabi"]
